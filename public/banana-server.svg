<svg width="100" height="100" viewBox="0 0 100 100" fill="none" xmlns="http://www.w3.org/2000/svg">
  <!-- Server Rack Body -->
  <rect x="25" y="15" width="50" height="70" rx="4" fill="#1E293B" stroke="#8B5CF6" stroke-width="2"/>
  <!-- Server Slots -->
  <rect x="30" y="25" width="40" height="8" rx="1" fill="#0F172A" stroke="#8B5CF6" stroke-width="1" opacity="0.5"/>
  <rect x="30" y="40" width="40" height="8" rx="1" fill="#0F172A" stroke="#8B5CF6" stroke-width="1" opacity="0.5"/>
  <rect x="30" y="55" width="40" height="8" rx="1" fill="#0F172A" stroke="#8B5CF6" stroke-width="1" opacity="0.5"/>
  <!-- Indicators -->
  <circle cx="35" cy="29" r="1.5" fill="#22C55E">
    <animate attributeName="opacity" values="1;0.3;1" dur="1s" repeatCount="indefinite" />
  </circle>
  <circle cx="35" cy="44" r="1.5" fill="#22C55E">
    <animate attributeName="opacity" values="1;0.3;1" dur="1.2s" repeatCount="indefinite" />
  </circle>
  <circle cx="35" cy="59" r="1.5" fill="#F59E0B">
    <animate attributeName="opacity" values="1;0.3;1" dur="0.8s" repeatCount="indefinite" />
  </circle>
  <!-- Glow -->
  <rect x="25" y="15" width="50" height="70" rx="4" fill="#8B5CF6" opacity="0.05"/>
</svg>